# Continuous integration for DevForge. Read-only by design: it checks, it never commits, pushes,
# publishes, deploys, uploads artifacts or comments (test/ci.test.js keeps it that way). Every action is
# pinned to a full commit SHA, so a moved tag cannot change what runs. Update the SHA and the comment together.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the default token can only read repository contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, checks, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run verify

  e2e:
    name: Chromium end-to-end (extension loaded for real)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright is a test driver, not a dependency of the extension, so it is installed here only.
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run e2e:features
      - run: npm run e2e:exports
      - run: npm run a11y
